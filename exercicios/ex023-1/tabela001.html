<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border: 1px solid black;
            width: 200px;
            height: 200px;
            border-collapse: collapse;
        }

        tr {
            background-color: bisque;
        }

        tr.linha {
            background-color: cadetblue;
        }

        tr.linha:hover {
            background-color: aqua;
            transition: ease 1s;
        }

        td {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        td.numero {
            text-align: right;
        }
        
    </style>
</head>

<body>
    <h1>Minha primeira tabela</h1>

    <!-- 
        HIERARQUIA DE TABELAS SIMPLES:
    TABLE = TABELA
    TABLE ROWS = LINHA DE TABELA
    TABLE READER = CABEÇALHO DA TABELA
    TABLE DATA = DADO DE TABELA

    Na W3C, o fechamento das tags 'td' e 'tr' são opcionais.
        -->

    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>

</html>

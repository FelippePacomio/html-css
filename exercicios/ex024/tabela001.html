<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: auto;
        }

        body {
            margin: 4%;
        }

        table {
            border: 1px solid black;
            border-collapse: collapse;
        }

        tr,
        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tbody > tr > th.cabecalho {
            background-color: white;
        }

        tbody > tr:nth-child(odd) {
            background-color: lightcoral;
        }


    </style>
    <title>Movies</title>
</head>

<body>
    <table>
        <caption>Movies</caption>
        <thead>
            <tr>
                <th scope="col" class="cabecalho">Grupo</th>
                <th scope="col" class="cabecalho">Nomes</th>
                <th scope="colgroup" colspan="3" class="cabecalho">Filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="3" class="cabecalho">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Beatriz Sousa</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>
            <tr>
                <td>Cláudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Bighero</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="3" class="cabecalho">Homens</th>
                <td>Bruno Mendonça</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
                <td>Daniel Lourenço</td>
                <td>Wall-E</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td>Fabiano Mota</td>
                <td>Star Wars 5 </td>
                <td>Taxi Driver</td>
                <td>Toy Story</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
